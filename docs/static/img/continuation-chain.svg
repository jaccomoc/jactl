<svg width="100%" viewBox="0 0 890 556" fill="none" xmlns="http://www.w3.org/2000/svg"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowHeadBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowHeadSlate" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="890" height="556" fill="#ffffff"/>

  <text x="263" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8" letter-spacing="0.5">JACTL CALL STACK (UNWINDING)</text>
  <text x="690" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8" letter-spacing="0.5">CHAIN OF CONTINUATION OBJECTS</text>

  <!-- Vertical chain arrows: sleep's Continuation is created first (top), each caller then -->
  <!-- wraps the one it just caught, growing the chain downwards -->
  <line x1="690" y1="146" x2="690" y2="166" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowHeadBlue)"/>
  <line x1="690" y1="242" x2="690" y2="262" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowHeadBlue)"/>
  <line x1="690" y1="338" x2="690" y2="358" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowHeadBlue)"/>
  <text x="720" y="160" font-size="10.5" font-style="italic" fill="#5b7db8">chained to&#8595;</text>

  <!-- Row-by-row mapping arrows (converge onto the fixed continuation column) -->
  <line x1="486" y1="98" x2="530" y2="98" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="464" y1="204" x2="530" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="442" y1="300" x2="530" y2="300" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="420" y1="396" x2="530" y2="396" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- ROW 1 (top of stack): sleep() - staggered to match the indentation in the first diagram -->
  <g transform="translate(66,0)">
    <rect x="40" y="50" width="380" height="96" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
    <text x="56" y="74" font-size="15" font-weight="700" fill="#b45309" font-family="'JetBrains Mono', Menlo, Consolas, monospace">sleep()</text>
    <rect x="336" y="60" width="68" height="18" rx="9" fill="#d97706"/>
    <text x="370" y="73" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.5">BLOCKING</text>
    <text x="56" y="94" font-size="11" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#8a5a1e">Continuation continuation = new Continuation();</text>
    <text x="56" y="112" font-size="11" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#8a5a1e">scheduleEvent(timeMs, () -&gt; continuation.resume());</text>
    <text x="56" y="130" font-size="11" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#8a5a1e">throw continuation;</text>
  </g>
  <g>
    <rect x="530" y="50" width="320" height="96" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
    <text x="546" y="103" font-size="14" font-weight="700" fill="#b45309" font-family="'JetBrains Mono', Menlo, Consolas, monospace">Continuation</text>
  </g>

  <!-- ROW 2: checkInventory() -->
  <g transform="translate(44,0)">
    <rect x="40" y="166" width="380" height="76" rx="8" fill="#eaf1fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="56" y="192" font-size="15" font-weight="700" fill="#0f2a5c">checkInventory()</text>
    <text x="56" y="212" font-size="11.5" fill="#5b7db8">&#8594; line 15: sleep()</text>
    <text x="56" y="231" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#3a4a63">item = "widget", qty = 5</text>
  </g>
  <g>
    <rect x="530" y="166" width="320" height="76" rx="8" fill="#eaf1fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="546" y="192" font-size="14" font-weight="700" fill="#0f2a5c" font-family="'JetBrains Mono', Menlo, Consolas, monospace">Continuation</text>
    <text x="546" y="212" font-size="11.5" fill="#5b7db8">location: line 15</text>
    <text x="546" y="231" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#3a4a63">item = "widget", qty = 5</text>
  </g>

  <!-- ROW 3: processOrder() -->
  <g transform="translate(22,0)">
    <rect x="40" y="262" width="380" height="76" rx="8" fill="#eaf1fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="56" y="288" font-size="15" font-weight="700" fill="#0f2a5c">processOrder()</text>
    <text x="56" y="308" font-size="11.5" fill="#5b7db8">&#8594; line 9: checkInventory()</text>
    <text x="56" y="327" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#3a4a63">order = "ORD-42", item = "widget"</text>
  </g>
  <g>
    <rect x="530" y="262" width="320" height="76" rx="8" fill="#eaf1fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="546" y="288" font-size="14" font-weight="700" fill="#0f2a5c" font-family="'JetBrains Mono', Menlo, Consolas, monospace">Continuation</text>
    <text x="546" y="308" font-size="11.5" fill="#5b7db8">location: line 9</text>
    <text x="546" y="327" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#3a4a63">order = "ORD-42", item = "widget"</text>
  </g>

  <!-- ROW 4 (bottom of stack): scriptMain -->
  <g>
    <rect x="40" y="358" width="380" height="76" rx="8" fill="#eaf1fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="56" y="384" font-size="15" font-weight="700" fill="#0f2a5c">scriptMain</text>
    <text x="56" y="404" font-size="11.5" fill="#5b7db8">&#8594; line 3: processOrder()</text>
    <text x="56" y="423" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#3a4a63">order = "ORD-42"</text>
  </g>
  <g>
    <rect x="530" y="358" width="320" height="76" rx="8" fill="#eaf1fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="546" y="384" font-size="14" font-weight="700" fill="#0f2a5c" font-family="'JetBrains Mono', Menlo, Consolas, monospace">Continuation</text>
    <text x="546" y="404" font-size="11.5" fill="#5b7db8">location: line 3</text>
    <text x="546" y="423" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#3a4a63">order = "ORD-42"</text>
  </g>

  <!-- Dashed arrow: the final Continuation exits the Jactl call stack, down to Java -->
  <line x1="690" y1="434" x2="690" y2="494" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowHeadSlate)"/>
  <text x="705" y="467" font-size="11" font-style="italic" fill="#64748b">returned to Java</text>

  <!-- Java caller box -->
  <rect x="530" y="494" width="320" height="34" rx="8" fill="#eef1f5" stroke="#64748b" stroke-width="2"/>
  <text x="690" y="515" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Java event completes</text>
</svg>
