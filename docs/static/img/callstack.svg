<svg width="100%" viewBox="0 0 700 556" fill="none" xmlns="http://www.w3.org/2000/svg"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowHeadBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="556" fill="#ffffff"/>

  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#0f2a5c">
    Call stack at the moment <tspan font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-weight="600">sleep()</tspan> suspends the script
  </text>

  <!-- Group brackets -->
  <path d="M42 66 H34 V360 H42" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <text x="18" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8"
        letter-spacing="0.5" transform="rotate(-90 18 213)">JACTL CALL STACK</text>

  <path d="M42 378 H34 V516 H42" stroke="#64748b" stroke-width="2" fill="none"/>
  <text x="18" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b"
        letter-spacing="0.5" transform="rotate(-90 18 447)">JAVA CALL STACK</text>

  <!-- Connectors (each arrow points up: caller below, callee pushed on top above it) -->
  <line x1="96" y1="456" x2="118" y2="438" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="118" y1="378" x2="140" y2="360" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowHeadBlue)"/>
  <text x="250" y="373" font-size="11.5" font-style="italic" fill="#1d4ed8">invokes the compiled Jactl bytecode</text>
  <line x1="140" y1="300" x2="162" y2="282" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="162" y1="222" x2="184" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="184" y1="144" x2="206" y2="126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- Frame: sleep() (top of stack - most recently called) -->
  <g>
    <rect x="166" y="66" width="470" height="60" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
    <text x="182" y="90" font-size="15" font-weight="700" fill="#b45309" font-family="'JetBrains Mono', Menlo, Consolas, monospace">sleep()</text>
    <rect x="576" y="74" width="44" height="18" rx="9" fill="#d97706"/>
    <text x="598" y="87" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.5">WAITS</text>
    <text x="182" y="110" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#8a5a1e">timeMs = 2000</text>
  </g>

  <!-- Frame: checkInventory() -->
  <g>
    <rect x="144" y="144" width="470" height="60" rx="8" fill="#eaf1fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="160" y="168" font-size="15" font-weight="700" fill="#0f2a5c">checkInventory()</text>
    <text x="598" y="168" text-anchor="end" font-size="11.5" fill="#5b7db8">line 15 &#8594; sleep()</text>
    <text x="160" y="188" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#3a4a63">item = "widget", qty = 5</text>
  </g>

  <!-- Frame: processOrder() -->
  <g>
    <rect x="122" y="222" width="470" height="60" rx="8" fill="#eaf1fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="138" y="246" font-size="15" font-weight="700" fill="#0f2a5c">processOrder()</text>
    <text x="576" y="246" text-anchor="end" font-size="11.5" fill="#5b7db8">line 9 &#8594; checkInventory()</text>
    <text x="138" y="266" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#3a4a63">order = "ORD-42", item = "widget"</text>
  </g>

  <!-- Frame: scriptMain -->
  <g>
    <rect x="100" y="300" width="470" height="60" rx="8" fill="#eaf1fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="116" y="324" font-size="15" font-weight="700" fill="#0f2a5c">scriptMain</text>
    <text x="554" y="324" text-anchor="end" font-size="11.5" fill="#5b7db8">line 3 &#8594; processOrder()</text>
    <text x="116" y="344" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#3a4a63">order = "ORD-42"</text>
  </g>

  <!-- Frame: JactlScript.eval() -->
  <g>
    <rect x="78" y="378" width="470" height="60" rx="8" fill="#eef1f5" stroke="#64748b" stroke-width="2"/>
    <text x="94" y="402" font-size="15" font-weight="700" fill="#334155">JactlScript.eval()</text>
    <text x="532" y="402" text-anchor="end" font-size="11.5" fill="#7c8ba1">&#8594; invokes scriptMain</text>
    <text x="94" y="422" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#51606f">globals = {}</text>
  </g>

  <!-- Frame: processEvent() (bottom of stack - the original caller) -->
  <g>
    <rect x="56" y="456" width="470" height="60" rx="8" fill="#eef1f5" stroke="#64748b" stroke-width="2"/>
    <text x="72" y="480" font-size="15" font-weight="700" fill="#334155">processEvent()</text>
    <text x="510" y="480" text-anchor="end" font-size="11.5" fill="#7c8ba1">line 5 &#8594; eval()</text>
    <text x="72" y="500" font-size="12" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#51606f">event = Event@3f1a</text>
  </g>
</svg>
