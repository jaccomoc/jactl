# /etc/nginx/sites-available/api.jactl.io.conf
#
# Public edge for the Jactl playground backend. Terminates TLS, rate-limits and
# size-caps requests, and proxies to the eval service on 127.0.0.1:8080 (the
# service listens on localhost only, so it is unreachable except through nginx).
#
# This file is included from within the http{} block (via sites-enabled), so the
# limit_req_zone below is valid here.
#
# TLS: this file starts as an HTTP (port 80) server. Running
#   certbot --nginx -d api.jactl.io
# rewrites it in place to add `listen 443 ssl`, the certificate paths, and an
# HTTP->HTTPS redirect. See provision.sh.
#
# CORS: intentionally NOT set here. The eval service already emits exact-origin
# CORS headers (and handles the OPTIONS preflight). Setting CORS here too would
# produce duplicate Access-Control-Allow-Origin headers, which browsers reject.
# If you would rather nginx own CORS, start the service with
#   -Djactl.playground.corsOrigin=off
# and uncomment the CORS block in the /run location below.

# Per-IP rate limit for the (expensive) eval endpoint. Tune once traffic is known.
limit_req_zone $binary_remote_addr zone=eval_limit:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.jactl.io;

    # Health check: cheap, no rate limit, short timeout.
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 5s;
    }

    location = /run {
        limit_req zone=eval_limit burst=5 nodelay;
        client_max_body_size 64k;

        # Must exceed the service's wallClockMs (8s) so nginx doesn't cut the
        # connection before the service returns its own timeout result.
        proxy_read_timeout 15s;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Optional: let nginx own CORS instead of the service ---
        # (requires -Djactl.playground.corsOrigin=off on the service)
        # if ($request_method = OPTIONS) {
        #     add_header Access-Control-Allow-Origin  "https://jactl.io" always;
        #     add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        #     add_header Access-Control-Allow-Headers "Content-Type" always;
        #     add_header Access-Control-Max-Age       86400 always;
        #     add_header Content-Length 0;
        #     return 204;
        # }
        # add_header Access-Control-Allow-Origin "https://jactl.io" always;
    }

    location / { return 404; }
}
